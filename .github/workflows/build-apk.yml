name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Dist
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://nexuswealth-backend-cn5g.onrender.com
          VITE_GOOGLE_CLIENT_ID: 572838786613-gpgpms78em01lg6sfan1cu2fti686nkj.apps.googleusercontent.com
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Direct Download
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk frontend/android/app/build/outputs/apk/debug/NexusWealth.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.4-build-${{ github.run_number }}
          name: "NexusWealth Android APK (Build ${{ github.run_number }})"
          body: "Direct download link for Android phone. Tap NexusWealth.apk below to install directly."
          files: frontend/android/app/build/outputs/apk/debug/NexusWealth.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusWealth-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/NexusWealth.apk
          retention-days: 14
